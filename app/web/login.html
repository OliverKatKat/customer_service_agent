<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · Echo 售后服务</title>
<link rel="stylesheet" href="/assets/app.css"><script src="/assets/session.js" defer></script><script src="/assets/ui.js" defer></script><script src="/assets/login.js" defer></script></head>
<body><header class="public-header"><a class="brand" href="/demo"><span class="brand-mark">e</span>echo<small>回声售后</small></a><nav><a href="/demo#scenarios">演示场景</a><span id="publicIdentity" class="muted"></span><a id="enterWorkspace" class="button primary" href="/login">登录工作区 ↗</a></nav></header><main class="login-layout"><section class="login-story"><span class="eyebrow">ONE CASE. ONE SHARED CONTEXT.</span><h1>从各自的角色出发，<br>把同一件事做好。</h1><p>使用你的账号登录，系统会带你进入对应的工作区。</p><div class="role-description"><span class="role-icon">01</span><div><b>客户</b><p>提出问题、补充信息、查看处理进度。</p></div></div><div class="role-description"><span class="role-icon">02</span><div><b>售后专员</b><p>整理材料、接续联系、跟进处理。</p></div></div><div class="role-description"><span class="role-icon">03</span><div><b>主管</b><p>核对依据、作出决定、追踪结果。</p></div></div></section>
<section class="login-card"><span class="eyebrow">WELCOME BACK</span><h2 style="margin-top:8px">登录工作区</h2><p class="sub">一个账号，一个清楚的工作入口。</p><p id="loginContext" class="login-context" hidden></p><form id="loginForm" class="stack"><div><label for="username">账号</label><input id="username" autocomplete="username" maxlength="100" placeholder="输入账号" required></div><div><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginButton" class="primary" type="submit">登录并进入 →</button></form><p id="loginError" class="feedback" role="status" aria-live="polite"></p><div class="divider"></div><p class="muted">演示账号 · 点击填入账号，再输入密码</p><div class="account-picks"><button type="button" data-account="demo_echo_alice">客户</button><button type="button" data-account="demo_echo_staff">售后专员</button><button type="button" data-account="demo_echo_admin">主管</button></div><p class="hint" style="margin-top:14px">演示密码见启动终端。登录后的页面由账号实际权限决定。</p><p class="hint" style="margin-top:12px"><a href="/demo">← 返回演示场景</a></p></section></main></body></html>
