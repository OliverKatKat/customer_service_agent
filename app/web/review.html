<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>退款人工审核工作台</title>
  <style>
    :root { color-scheme: light; font-family: system-ui,"Microsoft YaHei",sans-serif; color:#16243a; background:#f3f6fb; }
    * { box-sizing:border-box; }
    body { margin:0; }
    header { background:#102543; color:white; padding:22px clamp(18px,5vw,70px); display:flex; justify-content:space-between; align-items:center; gap:12px; }
    h1 { margin:0; font-size:22px; } h2 { margin:0 0 16px; font-size:19px; } h3 { margin:0 0 10px; font-size:16px; }
    small { color:#607089; } header small { color:#bbd0eb; }
    main { max-width:1160px; margin:28px auto; padding:0 18px 50px; }
    .card { background:#fff; border:1px solid #d9e3f0; border-radius:14px; padding:22px; box-shadow:0 6px 24px #18395b0b; }
    .grid { display:grid; grid-template-columns:minmax(280px,370px) minmax(0,1fr); gap:18px; }
    .stack { display:grid; gap:14px; }
    label { display:block; font-weight:600; font-size:13px; margin:0 0 5px; }
    input,textarea,select { width:100%; padding:10px 12px; border:1px solid #b9c9dc; border-radius:8px; font:inherit; background:white; color:#16243a; }
    textarea { min-height:82px; resize:vertical; }
    button { border:0; border-radius:8px; padding:10px 15px; background:#175fc6; color:white; font:inherit; font-weight:600; cursor:pointer; }
    button:hover { filter:brightness(.94); } button:disabled { opacity:.5; cursor:default; }
    button.secondary { background:#e8eef8; color:#18395b; } button.danger { background:#ad3543; }
    button.text { background:transparent; color:white; padding:7px; }
    .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .row > .grow { flex:1; min-width:160px; }
    .notice { padding:12px 14px; border-radius:9px; background:#fff6df; color:#654300; margin-bottom:18px; line-height:1.5; }
    .feedback { min-height:24px; color:#175fc6; margin:12px 0; font-size:14px; }
    .feedback.error { color:#ad3543; }
    .review { width:100%; text-align:left; background:#fff; color:#17263b; border:1px solid #d9e3f0; padding:13px; margin:0 0 9px; }
    .review.selected { border-color:#175fc6; background:#eff5ff; }
    .review b { display:block; margin-bottom:5px; }
    .review span { color:#607089; font-size:13px; }
    .details { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px 18px; margin-bottom:16px; }
    .details div { min-width:0; overflow-wrap:anywhere; }
    .details small { display:block; margin-bottom:2px; }
    .evidence { background:#f7f9fc; border:1px solid #e2e9f2; border-radius:9px; padding:14px; margin:14px 0; white-space:pre-wrap; }
    .audit { margin:6px 0; padding:9px 0; border-bottom:1px solid #e8edf5; font-size:14px; }
    .hidden { display:none !important; }
    @media (max-width:750px) { .grid { grid-template-columns:1fr; } .details { grid-template-columns:1fr; } header { padding:18px; } }
  </style>
</head>
<body>
<header><div><h1>退款人工审核工作台</h1><small>按商户身份隔离的本地演示</small></div><div class="row"><span id="who"></span><button id="logout" class="text hidden">退出</button></div></header>
<main>
  <div class="notice">此演示只更新原型数据库中的订单状态，未接入实际支付退款。审批记录与操作原因会保存在数据库中。</div>
  <section id="loginBox" class="card" style="max-width:440px;margin:auto">
    <h2>登录</h2>
    <form id="loginForm" class="stack">
      <div><label for="username">账号</label><input id="username" autocomplete="username" required></div>
      <div><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button type="submit">进入工作台</button>
    </form>
  </section>
  <section id="adminBox" class="grid hidden">
    <div class="card">
      <div class="row"><h2 class="grow">审核队列</h2><button id="refresh" class="secondary">刷新</button></div>
      <label for="filter">状态</label><select id="filter"><option value="pending">待审核</option><option value="approved">已批准</option><option value="rejected">已驳回</option></select>
      <p><small>每 8 秒自动刷新列表。点击条目查看证据与审计记录。</small></p>
      <div id="reviewList"></div>
    </div>
    <div id="detailCard" class="card"><h2>审核详情</h2><p>请选择左侧审核请求。</p></div>
  </section>
  <section id="customerBox" class="card hidden" style="max-width:620px;margin:auto">
    <h2>我的退款审核</h2>
    <p>输入你自己的工单号查询审核进度；页面每 8 秒刷新。</p>
    <div class="row"><div class="grow"><label for="ticketId">工单号</label><input id="ticketId" inputmode="numeric" pattern="[0-9]+"></div><button id="lookup">查询</button></div>
    <div id="customerResult" class="evidence hidden"></div>
  </section>
  <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let token = '', role = '', selectedId = null, selectedVersion = null, lastTicket = '', busy = false, detailLoading = false;
  const el = (tag, value, className) => {
    const node = document.createElement(tag);
    if (value != null) node.textContent = String(value);
    if (className) node.className = className;
    return node;
  };
  const clear = node => { while (node.firstChild) node.removeChild(node.firstChild); };
  function feedback(message, error = false) {
    $('feedback').textContent = message;
    $('feedback').classList.toggle('error', error);
  }
  async function api(path, options = {}) {
    const headers = new Headers(options.headers || {});
    if (token) headers.set('Authorization', `Bearer ${token}`);
    const response = await fetch(`/api/v1${path}`, {...options, headers});
    let data;
    try { data = await response.json(); } catch { data = {}; }
    if (!response.ok) {
      const detail = typeof data.detail === 'string' ? data.detail : `HTTP ${response.status}`;
      const error = new Error(detail); error.status = response.status; throw error;
    }
    return data;
  }
  function field(container, label, value) {
    const box = el('div'); box.append(el('small', label), el('strong', value ?? '—')); container.append(box);
  }
  async function loadList() {
    if (!token || role !== 'admin' || busy) return;
    try {
      const data = await api(`/reviews?state=${encodeURIComponent($('filter').value)}&limit=50`);
      clear($('reviewList'));
      if (!data.reviews.length) $('reviewList').append(el('p', '当前没有此状态的审核请求。'));
      for (const review of data.reviews) {
        const button = el('button', null, `review${review.review_id === selectedId ? ' selected' : ''}`);
        button.type = 'button';
        button.append(el('b', `#${review.review_id} · 工单 ${review.ticket_id}`),
          el('span', `${review.order_id} · ¥${review.amount.toFixed(2)} · ${review.status}`));
        button.addEventListener('click', () => loadDetail(review.review_id));
        $('reviewList').append(button);
      }
    } catch (error) { feedback(error.message, true); }
  }
  async function loadDetail(id) {
    if (detailLoading) return;
    detailLoading = true;
    try {
      const data = await api(`/reviews/${id}`);
      selectedId = id;
      selectedVersion = data.review.version;
      const panel = $('detailCard'); clear(panel);
      panel.dataset.reviewStatus = data.review.status;
      panel.append(el('h2', `审核 #${id}`));
      const details = el('div', null, 'details');
      field(details, '状态', data.review.status);
      field(details, '工单号', data.review.ticket_id);
      field(details, '客户', data.review.customer_id);
      field(details, '订单号', data.review.order_id);
      field(details, '申请金额', `¥${data.review.amount.toFixed(2)}`);
      field(details, '订单状态', data.evidence.order_status);
      field(details, '工单状态', data.evidence.ticket_status);
      field(details, '审核版本', data.review.version);
      field(details, '处理进度', data.processing_state === 'completed' ? '原型退款已完成'
        : data.processing_state === 'needs_attention' ? '自动恢复未完成，请人工核查'
        : data.processing_state === 'processing' ? '批准后处理中'
        : (data.review.status === 'rejected' ? '已驳回' : '等待人工审核'));
      if (data.recovery_attempts) field(details, '恢复尝试', data.recovery_attempts);
      panel.append(details);
      const evidence = el('div', null, 'evidence');
      evidence.append(el('h3', '核对依据'));
      evidence.append(el('div', `申请说明：${data.review.reason || '—'}`));
      evidence.append(el('div', `工单标题：${data.evidence.ticket_title || '—'}`));
      evidence.append(el('div', `客户描述：${data.evidence.ticket_description || '—'}`));
      evidence.append(el('div', `订单金额：¥${data.evidence.order_amount ?? '—'}`));
      panel.append(evidence);
      if (data.review.status === 'pending') {
        const form = el('div', null, 'stack');
        const reasonLabel = el('label', '审核理由（驳回时必填）');
        const reason = el('textarea'); reason.maxLength = 500; reason.placeholder = '核对订单、证据后填写结论';
        const codeLabel = el('label', '管理员二次审批凭据');
        const code = el('input'); code.type = 'password'; code.autocomplete = 'off';
        const actions = el('div', null, 'row');
        const approve = el('button', '批准放行');
        const reject = el('button', '驳回', 'danger');
        approve.addEventListener('click', () => decide('approve', reason.value, code.value));
        reject.addEventListener('click', () => decide('reject', reason.value, code.value));
        actions.append(approve, reject);
        form.append(reasonLabel, reason, codeLabel, code, actions);
        panel.append(form);
      } else {
        panel.append(el('p', `处理人：${data.review.decision_actor_id || '—'}；原因：${data.review.decision_reason || '—'}`));
      }
      panel.append(el('h3', '审计记录'));
      for (const event of data.audit) panel.append(el('div',
        `${event.created_at} · ${event.action} · ${event.actor_id}${event.reason ? ' · ' + event.reason : ''}`, 'audit'));
      await loadList();
    } catch (error) { feedback(error.message, true); }
    finally { detailLoading = false; }
  }
  async function decide(action, reason, code) {
    if (busy || selectedId == null) return;
    if (code.length < 16) { feedback('请填写管理员二次审批凭据。', true); return; }
    if (action === 'reject' && reason.trim().length < 3) { feedback('驳回理由至少 3 个字符。', true); return; }
    busy = true;
    try {
      const result = await api(`/reviews/${selectedId}/${action}`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({approval_code:code, expected_version:selectedVersion, reason:reason.trim()})
      });
      feedback(result.status === 'approved' ? '已批准，后台正在继续处理。' : '已驳回，订单未修改。');
      await loadDetail(selectedId);
    } catch (error) {
      feedback(error.message + ' 请刷新审核详情后再试。', true);
      if (error.status === 409) await loadDetail(selectedId);
    }
    finally { busy = false; await loadList(); }
  }
  async function lookup() {
    const id = $('ticketId').value.trim();
    if (!/^[0-9]+$/.test(id)) { feedback('请输入有效工单号。', true); return; }
    lastTicket = id;
    try {
      const data = await api(`/tickets/${encodeURIComponent(id)}/review`);
      $('customerResult').classList.remove('hidden');
      $('customerResult').textContent = `工单 ${id} · ${data.review_status}\n${data.message}`;
      feedback('状态已更新。');
    } catch (error) { $('customerResult').classList.add('hidden'); feedback(error.message, true); }
  }
  $('loginForm').addEventListener('submit', async event => {
    event.preventDefault();
    try {
      const body = new URLSearchParams({username:$('username').value.trim(), password:$('password').value});
      const response = await fetch('/api/v1/auth/login', {method:'POST', body});
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
      token = data.access_token; role = data.role;
      $('password').value = '';
      $('who').textContent = `${$('username').value.trim()} · ${data.tenant_id}`;
      $('loginBox').classList.add('hidden'); $('logout').classList.remove('hidden');
      $('adminBox').classList.toggle('hidden', role !== 'admin');
      $('customerBox').classList.toggle('hidden', role === 'admin');
      feedback('登录成功。');
      if (role === 'admin') await loadList();
    } catch (error) { feedback(error.message, true); }
  });
  $('logout').addEventListener('click', () => {
    token = ''; role = ''; selectedId = null; lastTicket = '';
    $('who').textContent = ''; $('loginBox').classList.remove('hidden');
    $('adminBox').classList.add('hidden'); $('customerBox').classList.add('hidden');
    $('logout').classList.add('hidden'); clear($('detailCard')); clear($('reviewList'));
    feedback('已退出。');
  });
  $('refresh').addEventListener('click', loadList);
  $('filter').addEventListener('change', loadList);
  $('lookup').addEventListener('click', lookup);
  setInterval(() => {
    if (role === 'admin') {
      if (selectedId != null && $('detailCard').dataset.reviewStatus === 'approved') loadDetail(selectedId);
      else loadList();
    } else if (role && lastTicket) lookup();
  }, 8000);
})();
</script>
</body>
</html>
