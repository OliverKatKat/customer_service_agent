services:
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: wb_test
      POSTGRES_PASSWORD: wb_local_test_only
      POSTGRES_DB: workbench_test
    ports:
      - "127.0.0.1:55458:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wb_test -d workbench_test"]
      interval: 2s
      timeout: 2s
      retries: 20
